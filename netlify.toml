[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/gracias"
  to = "/gracias.html"
  status = 200

[[headers]]
  for = "/app/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
